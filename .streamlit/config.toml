# Streamlit's own frontend telemetry, which defaults to ON: the browser caches
# a Fivetran webhook URL under stMetricsConfig in localStorage and reports
# anonymous usage from every visitor's device. It carries no question text, but
# it is a third-party beacon this app never disclosed, sitting behind a privacy
# policy and a name prompt that tells the soldier "נשמר במכשיר בלבד" — and the
# app already has its own metrics path, with an opt-out, for what it actually
# wants to know. Found 2026-08-23 in a fresh-visitor pass.
[browser]
gatherUsageStats = false

# Serve the source-order PDFs at /app/static/<file>.pdf so the "open PDF"
# action under each answer can link straight to the browser's PDF viewer.
[server]
enableStaticServing = true

# NO toolbarMode override. `toolbarMode = "minimal"` sounded like a clean
# way to drop the platform icons from the first loading frame, but on 1.58
# it UNMOUNTS the whole sidebar + stExpandSidebarButton from the DOM (A/B
# proven locally 2026-07-13: identical build, flag flipped via CLI — with
# "minimal" neither exists, with "auto" both return). That kills the drawer
# (letters, calculators, switch-role) on every device. Platform-icon flash
# is instead handled by the app CSS + the boot splash covering the frame.

# Pin the dark olive theme regardless of the device's light/dark mode —
# without this, iPhones in light mode render Streamlit's light theme
# (dark text) under our dark backgrounds and the text is unreadable.
#
# backgroundColor is the SPLASH color on purpose: Streamlit paints the whole
# loading screen with it from the moment the websocket delivers the config
# until the script's first render — so the wait matches the splash curtain
# instead of flashing a generic placeholder (verified on 1.58: the frontend
# caches only preset NAMES in localStorage, so this is the only themable
# loading phase). Since the 2026-08-03 dark chain the splash IS the app
# backdrop (#14170E), so every boot phase shares one color. The app itself
# repaints every visible surface anyway (and _render_admin injects its own
# dark override).
[theme]
base = "dark"
# Must track _ACCENT_OLIVE["accent"] in app.py. #99A26B was the pre-2026-08-03
# olive; when the palette rebased to #A3AE6E this file was missed, so every
# control Streamlit paints ITSELF (focus rings, spinners, checkboxes, slider
# tracks) kept drawing the old accent beside the app's new one.
primaryColor = "#A3AE6E"
backgroundColor = "#14170E"
secondaryBackgroundColor = "#21261A"
# Matches the --text token (#EFF0E8). These were 3 units apart, which put two
# near-whites in the app at once: everything Streamlit painted by default used
# #ECEDE6 while every var(--text) surface used #EFF0E8. Invisible individually,
# but it is what let the app-authored CSS drift to a third value unnoticed.
textColor = "#EFF0E8"
# dataframe headers default to a mix of backgroundColor (now olive) — keep
# the admin tables' header row on the dark surface color instead
dataframeHeaderBackgroundColor = "#21261A"
