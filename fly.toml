# Fly.io config for CommandAI. Rename `app` to your own unique app name
# (or let `fly launch` set it). `fra` (Frankfurt) is the closest Fly region
# to Israel; change with `fly regions set <code>` if you prefer.
app = "commandai"
primary_region = "fra"

# Swap is the OOM airbag, not a fix: 2026-07-27 12:08Z the kernel killed
# streamlit at 871MB anon-RSS while ONE user asked ONE question — the machine
# rebooted mid-answer and the question was lost. With swap the same spike
# slows down instead of dying. The actual allocations are being trimmed in
# app code; swap stays as insurance. Costs nothing (disk-backed).
#
# IT MUST LIVE HERE, above every table header, and that is the whole story of
# why it never worked. It used to sit below [[http_service.checks]], where TOML
# scopes a bare key to the LAST table opened — so it parsed as
# http_service.checks[0].swap_size_mb, an unknown key inside a health check,
# which Fly drops without a word. Confirmed twice: absent from the machine
# config (`fly machine status -d` -> guest has no swap field) and absent from
# the kernel (`/proc/meminfo` -> SwapTotal 0) on 2026-07-28 AND again on
# 2026-08-01, across many deploys that all "succeeded".
swap_size_mb = 768

# The boot shell's service worker, off by default in code (boot_shell.py reads
# CAI_SW). Turned on for the launch flash: the OS launch image cross-fades out
# at ~1.7s and reveals the web view's white canvas for ~50ms because our first
# paint has not landed yet. That the gap is OUR paint timing and not an OS layer
# is not a guess — deblocking Streamlit's stylesheet already moved the same
# flash from 130ms to 50ms. The worker serves the shell from cache
# (domInteractive 21.7ms, transferSize 0), so first paint beats the fade and
# there is nothing left to bleed through. It also saves ~3.9s a launch.
#
# Escape hatch if it ever misbehaves: ?nosw=1 in the address bar tears it out
# and sticks (localStorage), ?nosw=0 puts it back. Removing this key and
# redeploying stops NEW registrations but does not unregister existing ones —
# use ?nosw=1 for that.
[env]
  CAI_SW = "1"
  # Hypothetical-answer retrieval (backend.RETRIEVE_HYDE). Off in code so a
  # local boot never buys anything unasked; on here by the user's decision of
  # 2026-08-17 after the paired measure: frozen 30 19/60 -> 25/60, held-out 24
  # 11/47 -> 14/47, retrieval gate 390/415 with zero regressions. Costs one
  # Haiku call (~$0.0012) and ~1.5s per question. Turn off with "0" and
  # redeploy — the code needs nothing else.
  RETRIEVE_HYDE = "1"
  # Soldier-to-order glossary appended to the retrieval query (storage/glossary.py).
  # Off in code; on here after the free 415-case gate read 385->386 with zero
  # regressions and the live failure that found it (a mental-health appointment
  # question phrased with the soldiers' abbreviation retrieved farewell
  # ceremonies; it now retrieves the mental-distress order first). Costs nothing
  # per question. Turn off with "0" and redeploy. ASCII only in this file:
  # flyctl's config parser rejected the Hebrew quote marks as control characters.
  RETRIEVE_GLOSSARY = "1"
  # Serve the LEAD order's whole curated block (now digest-enriched) alongside
  # the ranked chunks. Off in code; on here after the 2026-08-21 synchronous
  # round measured the bundle (targeted anchors + this) up on ALL three sets —
  # typical 8->13/40 with zero control flips, held-out 27->31/47, frozen
  # 22->26/58 — at about +2,100 words (~+$0.02) per question. Turn off with "0".
  RETRIEVE_FULL_BLOCKS = "1"
  # A seat in the context for each of the document router's top picks
  # (backend.extend_with_router_slots). Off in code; on here after the
  # mini-pilot 150 adjudication of 2026-08-25 measured why the router was
  # paying for a shortlist it could not deliver. On the 25 questions of the two
  # largest failure clusters, with router decisions frozen so the sweep was
  # free: the answering order reached the context 10/25 with no seats, 15/25
  # with one, 16/25 with two - and where the router named the answering order
  # at all, 5/11 became 11/11. The orders retrieval finds unaided stayed at 5,
  # because seats are APPENDED and cannot evict. Cost is about one extra chunk
  # (median context 15 -> 16) and no extra API call: the router is already
  # paid for. The alternative repair - raising _ROUTE_BOOST to 0.15 - was
  # measured on all 431 gate cases with the router live and rejected: it broke
  # six and rescued three, and the breaks are not anchorable (35.0205 already
  # carries an anchor near-identical to the question it loses, and a bigger
  # bonus lifts its competitor by exactly as much). Turn off with "0".
  # ASCII only in this file: flyctl rejects Hebrew quote marks.
  RETRIEVE_ROUTER_SLOTS = "2"
  # The second search (backend.RETRIEVE_SECOND_PASS + the app.py wiring):
  # when an answer declares a gap, its own restatement of the missing rule is
  # re-retrieved and the question re-answered with 4 window seats reserved for
  # those chunks; the second answer replaces the first. Off in code; on here
  # after the paired 72-question measurement of 2026-08-28: full answers
  # 15 -> 23 (p=0.008, zero losses), control arm (fresh call, no second
  # search) 17 - the first campaign result to clear p<0.05. Context size is
  # unchanged; the price is one extra Opus call plus its latency, and ONLY on
  # answers that declared a gap (a successful answer never re-searches).
  # Turn off with "0" and redeploy - the code needs nothing else.
  RETRIEVE_SECOND_PASS = "4"
  # How long backend.load_documents trusts its last freshness scan. Off in
  # code (0 = scan every call), which is what the night pipeline needs since
  # it writes into json_store while the same process reads it. Here it is on:
  # in production json_store only changes on deploy, and a deploy starts a
  # fresh process, so the staleness this buys cannot be observed. Profiled
  # locally on 2026-08-24: the scan is 32.8ms and runs about three times per
  # question, so this removes ~98ms per question. The Fly volume is
  # network-backed and a stat is a round-trip there, so the real saving is
  # plausibly larger - NOT measured, do not quote it as if it were.
  DOC_SCAN_TTL_SEC = "5"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Always-on: keep exactly one machine running so there is never a cold
  # start (the whole reason we left Community Cloud). This is the cheap,
  # steady-state single-machine setup.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 60
    hard_limit = 80

  # Streamlit's health endpoint — Fly marks the machine healthy once it answers.
  [[http_service.checks]]
    interval = "15s"
    timeout = "4s"
    grace_period = "40s"
    method = "GET"
    path = "/_stcore/health"

[[vm]]
  # TWO shared vCPUs, not one. Measured on production 2026-08-01 with real
  # Streamlit sessions (websocket + BackMsg.rerun_script, waiting for
  # script_finished): 1 session finishes in 1.4s, 6 in 4.4s, 12 in 5.6s, 20 in
  # 12.7s — nothing ever failed, and memory never moved (895->897MB across all
  # of it). The whole curve is script runs queueing behind ONE core, so the
  # pilot's 12 testers pay for each other's boots in latency. The second core
  # is the only lever that touches that, and it is a couple of dollars a month.
  size = "shared-cpu-2x"
  # 2GB, not 1GB. At 1GB the app rested at ~664-727MB anon with ~56MB
  # available — a 6% margin on a process whose answer path allocates in
  # hundreds of MB. That margin is what killed it on 2026-07-27 (OOM at
  # 871MB, mid-answer) and what made the 2026-07-28 morning launch crawl.
  # The trims (chromadb/sentencepiece, ~330MB) are still worth doing; this
  # buys the headroom now for ~$1.8/mo instead of waiting for them.
  #
  # NOTE: a live machine's memory does NOT follow this file on its own —
  # verify with `fly machine status <id> -d` after every deploy, exactly
  # like swap_size_mb below, which silently never applied at all.
  memory = "2gb"
