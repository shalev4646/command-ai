# Fly.io config for CommandAI. Rename `app` to your own unique app name
# (or let `fly launch` set it). `fra` (Frankfurt) is the closest Fly region
# to Israel; change with `fly regions set <code>` if you prefer.
app = "commandai"
primary_region = "fra"

# Swap is the OOM airbag, not a fix: 2026-07-27 12:08Z the kernel killed
# streamlit at 871MB anon-RSS while ONE user asked ONE question — the machine
# rebooted mid-answer and the question was lost. With swap the same spike
# slows down instead of dying. The actual allocations are being trimmed in
# app code; swap stays as insurance. Costs nothing (disk-backed).
#
# IT MUST LIVE HERE, above every table header, and that is the whole story of
# why it never worked. It used to sit below [[http_service.checks]], where TOML
# scopes a bare key to the LAST table opened — so it parsed as
# http_service.checks[0].swap_size_mb, an unknown key inside a health check,
# which Fly drops without a word. Confirmed twice: absent from the machine
# config (`fly machine status -d` -> guest has no swap field) and absent from
# the kernel (`/proc/meminfo` -> SwapTotal 0) on 2026-07-28 AND again on
# 2026-08-01, across many deploys that all "succeeded".
swap_size_mb = 768

# The boot shell's service worker, off by default in code (boot_shell.py reads
# CAI_SW). Turned on for the launch flash: the OS launch image cross-fades out
# at ~1.7s and reveals the web view's white canvas for ~50ms because our first
# paint has not landed yet. That the gap is OUR paint timing and not an OS layer
# is not a guess — deblocking Streamlit's stylesheet already moved the same
# flash from 130ms to 50ms. The worker serves the shell from cache
# (domInteractive 21.7ms, transferSize 0), so first paint beats the fade and
# there is nothing left to bleed through. It also saves ~3.9s a launch.
#
# Escape hatch if it ever misbehaves: ?nosw=1 in the address bar tears it out
# and sticks (localStorage), ?nosw=0 puts it back. Removing this key and
# redeploying stops NEW registrations but does not unregister existing ones —
# use ?nosw=1 for that.
[env]
  CAI_SW = "1"
  # TEMPORARY — remove together with _FLASH_PROBE in boot_shell.py and the
  # matching ENV in the Dockerfile once the launch flash is settled. It draws a
  # full-screen diagnostic overlay 3s into every launch, so it must NOT be live
  # when testers are on the app.
  CAI_FLASHPROBE = "1"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Always-on: keep exactly one machine running so there is never a cold
  # start (the whole reason we left Community Cloud). This is the cheap,
  # steady-state single-machine setup.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 60
    hard_limit = 80

  # Streamlit's health endpoint — Fly marks the machine healthy once it answers.
  [[http_service.checks]]
    interval = "15s"
    timeout = "4s"
    grace_period = "40s"
    method = "GET"
    path = "/_stcore/health"

[[vm]]
  # TWO shared vCPUs, not one. Measured on production 2026-08-01 with real
  # Streamlit sessions (websocket + BackMsg.rerun_script, waiting for
  # script_finished): 1 session finishes in 1.4s, 6 in 4.4s, 12 in 5.6s, 20 in
  # 12.7s — nothing ever failed, and memory never moved (895->897MB across all
  # of it). The whole curve is script runs queueing behind ONE core, so the
  # pilot's 12 testers pay for each other's boots in latency. The second core
  # is the only lever that touches that, and it is a couple of dollars a month.
  size = "shared-cpu-2x"
  # 2GB, not 1GB. At 1GB the app rested at ~664-727MB anon with ~56MB
  # available — a 6% margin on a process whose answer path allocates in
  # hundreds of MB. That margin is what killed it on 2026-07-27 (OOM at
  # 871MB, mid-answer) and what made the 2026-07-28 morning launch crawl.
  # The trims (chromadb/sentencepiece, ~330MB) are still worth doing; this
  # buys the headroom now for ~$1.8/mo instead of waiting for them.
  #
  # NOTE: a live machine's memory does NOT follow this file on its own —
  # verify with `fly machine status <id> -d` after every deploy, exactly
  # like swap_size_mb below, which silently never applied at all.
  memory = "2gb"
