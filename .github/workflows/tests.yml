# The free gate, on every push: all tests/test_*.py via tests/run_all.py,
# exactly the suite the local loop runs (plain-assert scripts, no pytest).
#
# Nothing here can spend money: no ANTHROPIC secret is configured on the
# repo, the app-importing tests stub backend.ensure_pdfs_ingested before
# import, and run_all.py blanks ANTHROPIC_API_KEY in the child env anyway.
# Retrieval tests work for real, though -- corpus chunks come from the
# committed storage/json_store + embedding_cache.npz, and only the QUERIES
# are embedded live, which needs the ~120MB quantized ONNX model from
# HuggingFace (cached between runs below).
name: tests

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # what production runs (Dockerfile python:3.12-slim)
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache the query-embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-paraphrase-multilingual-minilm-l12-v2-quint8

      - name: Run the suite
        run: python tests/run_all.py
